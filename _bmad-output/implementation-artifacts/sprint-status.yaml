# STATUS DEFINITIONS:
# ==================
# Epic Status:
#   - backlog: Epic not yet started
#   - in-progress: Epic actively being worked on
#   - done: All stories in epic completed
#
# Epic Status Transitions:
#   - backlog → in-progress: Automatically when first story is created (via create-story)
#   - in-progress → done: Manually when all stories reach 'done' status
#
# Story Status:
#   - backlog: Story only exists in epic file
#   - ready-for-dev: Story file created in stories folder
#   - in-progress: Developer actively working on implementation
#   - review: Ready for code review (via Dev's code-review workflow)
#   - done: Story completed
#
# Retrospective Status:
#   - optional: Can be completed but not required
#   - done: Retrospective has been completed
#
# Action Item Status:
#   - open: Committed during a retrospective, not yet addressed
#   - in-progress: Actively being worked on
#   - done: Completed
#
# WORKFLOW NOTES:
# ===============
# - Epic transitions to 'in-progress' automatically when first story is created
# - Stories can be worked in parallel if team capacity allows
# - Developer typically creates next story after previous one is 'done' to incorporate learnings
# - Dev moves story to 'review', then runs code-review (fresh context, different LLM recommended)
# - Retrospective appends its action items to action_items; sprint-status surfaces open ones
#
# SEQUENCING RULES
# ================
# - Stories 6-1 and 6-2 MUST complete before Epic 2 finishes (gate G1.5 consumes the two Track A
#   skills). Epic 6 is parallel-eligible once Epic 1 is done.
# - Epics are gate-sequential (AD-19): epic N+1 must not start before epic N's gate-exit story is
#   done. Epic 6 is the parallel exception (after Epic 1).
# - Epic 7 depends on a Phase-5 Assemblies capability (not yet an epic) — scope Assemblies first.
#   Skills 6-8..6-10 pair with Epic 7 (ablation-ready drafts; ablated when GS infra + Epic-7 tools
#   exist).
# - Epic 8 is parallel-eligible after Epic 1: it adds one tool plus an optional ResultEnvelope key
#   on top of the shipped bridge, weakens no AD, and reopens no closed gate. Story 8.1 must NOT
#   extend adapters/render_probe.py — that would force a second AD-1 Qt exemption; the framing port
#   belongs in hosts/gui_addon/. Story 8.5 also closes a live defect: check_imports.py
#   FREECAD_MODULE_ALIASES omits FreeCADGui, so FreeCADGui.ActiveDocument evades the AD-20
#   ActiveDocument ban in CI.
# - Epic 9 corrects shipped behaviour in Epic 8 and story 1-9, so it opens no gate and Epic 8 stays
#   'done' (AD-19 keeps a passed gate closed). Ordering: 9-1 -> 9-2 (both edit usecases/view_fit.py,
#   keep the diffs separable); 9-3 and 9-4 touch disjoint files and are parallel-eligible with
#   either. No gate-exit story: acceptance is re-running the four reproducers against each story's
#   regression fixture. Story 9-1 carries DR-3 as well as DR-1 — the framing carve-out is not
#   independently shippable, because a SPEC_FAILED without its ratio is less informative than the
#   defect it replaces. Story 9-3 must also update design/integration-mcp-freecad.md's render rig.
# - Epic 10 corrects shipped behaviour found by the first complete UAT run (2026-10-03-04), so it
#   opens no gate and reopens no epic (AD-19). Epic 4 is paused after story 4-2: story 4-3 starts
#   only when epic-10 is done. Ordering: 10-1..10-6 are parallel-eligible except 10-2 -> 10-3
#   (both edit post-verify in usecases/transaction.py and usecases/verify.py); 10-7 runs alongside;
#   10-7 -> 10-7b (the runner encodes the corrected test cases); 10-8 (full UAT re-run, Gate 1
#   green, using the 10-7b runner) is last and closes the epic.

