  spec_checkpoint: true
  invoke_dev_with: >-
    Contract: tool-contracts.md section T-6. Depends on story 2 (AD-5 amendment). Keep the
    AD-27 timeout quarantine and the 30 s budget unchanged. Handle a script that opens its own
    transaction.

