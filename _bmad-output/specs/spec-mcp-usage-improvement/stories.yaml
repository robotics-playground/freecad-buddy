- id: "1"
  title: Result text without duplicated long strings
  description: >-
    summary_text renders a string longer than 80 characters, or with a newline, as a size
    signal, so script_exec results carry value_repr and stdout once (T-13, CAP-8).
  invoke_dev_with: >-
    Contract: tool-contracts.md section T-13. Change contracts/envelope.py:summary_text only;
    bespoke summaries stay as they are.

- id: "2"
  title: Align documents on the role of script_exec and amend AD-5
  description: >-
    Amend AD-5 to the observe-only script_exec bracket, give script_exec its own escape-route
    row in mcp-tools-design.md, correct spec-freecad-buddy/SPEC.md:120, and add the
    exec.python_error detail code (T-11, CAP-7).
  spec_checkpoint: true
  invoke_dev_with: >-
    Contract: tool-contracts.md sections T-11 and T-6. Documents only, no code. Story 13
    implements the amended AD-5.

- id: "3"
  title: Server instructions that put typed tools first
  description: >-
    The MCP initialize result carries client-neutral instructions listing each tool family and
    naming script_exec as the route for listed gaps; the script_exec description points to
    them (T-10, CAP-6).
  invoke_dev_with: >-
    Contract: tool-contracts.md section T-10. No client-specific tool-loading text in the server
    (model agnosticism convention). Keep instructions at or below 250 words.

- id: "4"
  title: Skill routing to existing typed tools and the full gap list
  description: >-
    Skills route bounding box, volume and validity to query_mass_properties and verify_shape;
    freecad-scripting-idioms holds the full gap list with the accepted traced-outline route;
    part-sourcing drops the non-existent import path (T-1 step one, T-14, CAP-6).
  invoke_dev_with: >-
    Contract: tool-contracts.md section T-1. Each SKILL.md stays at 4 sections and at most
    1,500 words; run scripts/check_skill_shape.py.

- id: "5"
