name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  assets:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build the wheel and the sdist
        run: uv build
      - name: Build the addon zip (bundles the wheel)
        run: >-
          uv run --no-project --python 3.11 python scripts/build_addon.py --release
          --wheel dist/freecad_buddy-${{ needs.release-please.outputs.version }}-py3-none-any.whl
      - name: Upload the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload --clobber ${{ needs.release-please.outputs.tag_name }}
          dist/freecad_buddy-${{ needs.release-please.outputs.version }}-py3-none-any.whl
          dist/freecad_buddy-${{ needs.release-please.outputs.version }}.tar.gz
          dist/FreeCADBuddy-${{ needs.release-please.outputs.version }}.zip
