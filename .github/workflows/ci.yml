name: ci

on: [push, pull_request]

jobs:
  arch-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - name: Ring / Qt import enforcement
        run: uv run python scripts/check_imports.py
      - name: Status vocabulary enforcement
        run: uv run python scripts/check_status_vocab.py
      - name: Schema drift check
        run: uv run python scripts/gen_schemas.py --check
      - name: Provenance gate (AD-16)
        run: uv run python scripts/check_provenance.py
      - name: Entry gate G0 fails honestly against the stub (AD-19)
        run: |
          if uv run python benchmarks/runner.py --gate G0 --stub; then
            echo "runner unexpectedly green (should fail honestly against the stub)"; exit 1;
          fi
      - name: Entry gate G1 fails honestly against the stub (AD-19)
        run: |
          if uv run python benchmarks/runner.py --gate G1 --stub; then
            echo "G1 runner unexpectedly green (should fail honestly against the stub)"; exit 1;
          fi
      - name: Entry gate G3 fails honestly against the stub (AD-19)
        # Exit 1 is the honest criterion failure; 2 is a usage/loader error and must not pass.
        run: |
          set +e
          uv run python benchmarks/runner.py --gate G3 --stub
          code=$?
          if [ "$code" -ne 1 ]; then
            echo "G3 stub run exited $code, expected exactly 1 (honest failure)"; exit 1;
          fi
      - name: G1 grader clears sensitivity/FA bars (deterministic, no network)
        run: uv run python benchmarks/g1/fault-injection/score_grader.py --check
      - name: G1 read-only profile guarantee (G1.6, offline)
        run: uv run pytest tests/external/test_assistant_readonly_profile.py -q
      - name: G1 actor-run (offline scripted backend; live eval skipped, no secrets)
        run: |
          out=$(uv run python benchmarks/runner.py --gate G1 --actor-run) || {
            echo "$out"; echo "offline actor-run should exit 0"; exit 1;
          }
          echo "$out"
          echo "$out" | grep -q "live eval skipped" || {
            echo "live eval must be skipped in CI (no operator backend)"; exit 1;
          }
      - name: G1 ReAct adapter + backend actor-run (offline, no key/secret/network/GGUF)
        run: uv run pytest tests/external/test_react_adapter.py tests/external/test_react_backend_actor_run.py -q
      - name: G1 gate-exit machinery (seal/unseal/burn + leg-c, offline, no key/secret)
        run: uv run pytest tests/external/test_gate_g1_exit.py -q
      - name: G1 held-out holds only the sealed pair (no unsealed live case leaked)
        run: uv run pytest tests/external/test_harness_g1.py::test_g1_heldout_contains_only_placeholder -q
      - name: G2 gate-exit machinery (collectors, seal ceremony, verdict legs, offline)
        run: uv run pytest tests/external/test_gate_g2_exit.py -q
      - name: G2 held-out holds only the sealed pair (no unsealed case.yaml)
        run: |
          uv run pytest tests/external/test_g2_benchmark.py -q -k "heldout or sealed_archive"
          # `find`, not a single-level glob: seal.py stages cases with rglob, so a case nested
          # any deeper than one directory is sealed but would be invisible to `*/case.yaml`.
          if [ -n "$(find benchmarks/g2/heldout -name case.yaml -print -quit)" ]; then
            echo "benchmarks/g2/heldout/ holds an unsealed case.yaml — the set is not sealed"; exit 1;
          fi
      - name: "G2 fault fixtures are all materialized (no 'fixture: pending')"
        run: |
          if grep -rn --include=case.yaml "fixture: pending" benchmarks/g2/; then
            echo "a G2 fault case still declares its fixture pending"; exit 1;
          fi
      - name: Ruff (T201 print-ban honored)
        run: uv run ruff check .
      - name: External suite
        run: uv run pytest tests/external

  headless:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { freecad: "1.1.3", python: "3.11" }
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: fc
          create-args: >-
            python=${{ matrix.python }} freecad=${{ matrix.freecad }}
          condarc: |
            channels:
              - conda-forge
          cache-environment: true
      # Install the package WITHOUT runtime deps (no third-party wheels built against
      # FreeCAD's bundled interpreter for the in-FreeCAD suite). The external suite needs
      # `mcp` (pin CLOSED in decision 005) because the MCP-surface tests import the H1 host
      # wiring; add it alongside the test tools. H1 is a single process (FreeCAD + mcp in one
      # interpreter), so `mcp` living in this conda env is also what makes `--mode inline`
      # servable on this leg.
      - run: micromamba run -n fc python -m pip install --no-deps -e . && micromamba run -n fc python -m pip install "mcp>=1.28,<2" pytest jsonschema pyyaml
      - name: In-FreeCAD suite (stdlib unittest, one process)
        timeout-minutes: 15
        run: micromamba run -n fc FreeCADCmd tests/run_tests.py
      - name: External suite (MCP surface, dispatch, audit)
        timeout-minutes: 15
        run: micromamba run -n fc pytest tests/external
      - name: Emit G0.4 leg evidence (green iff both suites above passed)
        run: >-
          python benchmarks/g0/emit_ci_evidence.py
          --run ci-${{ github.sha }}
          --leg 1.1.x
          --green true --tests 30
      - name: Upload G0.4 leg evidence
        uses: actions/upload-artifact@v4
        with:
          name: g0-4-1.1.x
          path: benchmarks/gate-artifacts/g0/ci-${{ github.sha }}/evidence/
      # Replays the G3 corrupted-plan suite over the H1 stdio host, checks the bars, and compares
      # every resolved anchor frame with the committed 1.1.x reference (G3.E.3). --check: CI never
      # writes validators.yaml.
      - name: G3 corrupted-plan replay and frame check
        timeout-minutes: 15
        run: >-
          micromamba run -n fc python benchmarks/g3/fault-injection/score_g3_replay.py
          --leg 1.1.x
          --run ci-${{ github.sha }} --check
          --frames-check benchmarks/g3/fault-injection/frames-reference.json
      - name: Upload G3.E.3 leg evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g3-e3-1.1.x
          path: benchmarks/gate-artifacts/g3/ci-${{ github.sha }}/

  g0-verdict:
    # Downloads the 1.1.x headless-leg G0.4 artifact into the run dir and runs run+verdict on
    # the same --run ci-<sha> the evidence landed in (non-blocking: the G0 gate is not yet green).
    needs: [headless]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - name: Download the G0.4 leg artifact into the run's evidence dir
        uses: actions/download-artifact@v4
        with:
          name: g0-4-1.1.x
          path: benchmarks/gate-artifacts/g0/ci-${{ github.sha }}/evidence/
      - name: Consume G0.4 evidence via run + verdict (non-blocking)
        run: |
          uv run python benchmarks/runner.py run G0 --run ci-${{ github.sha }} || true
          uv run python benchmarks/runner.py verdict G0 --run ci-${{ github.sha }} || true

  render:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: fc
          create-args: >-
            python=3.11 freecad=1.1.3
          condarc: |
            channels:
              - conda-forge
          cache-environment: true
      - run: micromamba run -n fc python -m pip install --no-deps -e . && micromamba run -n fc python -m pip install pytest jsonschema pyyaml
      - name: Render leg (in-FreeCAD suite under xvfb; software GL)
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: |
          xvfb-run -a -s "-screen 0 1024x768x24" \
            micromamba run -n fc FreeCADCmd tests/run_tests.py
