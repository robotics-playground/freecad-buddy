name: ci

on: [push, pull_request]

jobs:
  arch-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - name: Ring / Qt import enforcement
        run: uv run python scripts/check_imports.py
      - name: Ruff (T201 print-ban honored)
        run: uv run ruff check .
      - name: External suite
        run: uv run pytest tests/external

  headless:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { freecad: "1.0.0", python: "3.11" }
          - { freecad: "1.1.0", python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: fc
          create-args: >-
            python=${{ matrix.python }} freecad=${{ matrix.freecad }}
          condarc: |
            channels:
              - conda-forge
          cache-environment: true
      # Install the package WITHOUT runtime deps so this blocking leg is not coupled to the
      # unpinned `mcp` (decision 005) or to third-party wheels building against FreeCAD's
      # bundled interpreter. The Phase-0 suites need only pytest.
      - run: micromamba run -n fc python -m pip install --no-deps -e . && micromamba run -n fc python -m pip install pytest
      - name: In-FreeCAD suite (stdlib unittest, one process)
        timeout-minutes: 15
        run: micromamba run -n fc FreeCADCmd tests/run_tests.py
      - name: External suite
        timeout-minutes: 15
        run: micromamba run -n fc pytest tests/external

  render:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: fc
          create-args: >-
            python=3.12 freecad=1.1.0
          condarc: |
            channels:
              - conda-forge
          cache-environment: true
      - run: micromamba run -n fc python -m pip install --no-deps -e . && micromamba run -n fc python -m pip install pytest
      - name: Render leg (isolated; no render tests yet)
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          xvfb-run -a -s "-screen 0 1024x768x24" \
            micromamba run -n fc python -c "import sys; sys.stderr.write('render leg placeholder: no render tests yet\n')"
