[project]
name = "freecad-buddy"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    # mcp pin CLOSED at the Phase-0 gate (Story 1.4) — see docs/decisions/005-mcp-sdk-pin.md.
    # Official MCP python-sdk still on the v1 line (no FastMCP->MCPServer v2 rename yet); the
    # low-level `mcp.server.lowlevel.Server` is the confirmed stdio-serve + tools/list surface
    # with explicit inputSchema/outputSchema. Floor >=1.28 (installed 1.28.1), cap below the
    # eventual v2 rename so an unattended upgrade cannot silently break the import surface.
    "mcp>=1.28,<2",  # official MCP python-sdk (NOT PrefectHQ fastmcp)
    "trimesh==4.*",  # export oracle (AD-9)
    "lib3mf==2.*",   # 3MF oracle (AD-9)
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "jsonschema>=4", "pyyaml>=6"]  # pyyaml: external harness only (AD-12)
stl-oracle = ["admesh ; sys_platform == 'linux'"]  # optional 2nd oracle; fallback chosen at Phase 0 gate (AD-9)
# Optional OpenAI-compatible client for an operator's live local (llama.cpp/Qwen) ReAct eval.
# External-only + never required: the ReAct adapter injects its chat transport, so CI drives it
# offline against a scripted double and never installs this (see decision 011).
react-local = ["openai>=1"]

[project.scripts]
freecad-buddy = "freecad_buddy.hosts.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freecad_buddy"]

[tool.pytest.ini_options]
# Default collection is the FreeCAD-free external suite; tests/infc/ runs only under FreeCADCmd
# (stdlib unittest, AD-12), never under `uv run pytest`. A bare `pytest` must not collect it.
testpaths = ["tests/external"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "scripts", "tests", "benchmarks"]
# Non-project tooling / references / planning artifacts — not linted by CI's `ruff check .`.
extend-exclude = [
    ".agents",
    ".claude",
    ".bmad-loop",
    "_bmad",
    "_bmad-output",
    "docs/references",
]

[tool.ruff.lint]
select = ["E", "F", "T201"]  # T201 = flake8-print: ban print() in src/

[tool.ruff.lint.per-file-ignores]
# T201 print-ban applies to src/ only; scripts/, tests/, and benchmarks/ are tooling and may print.
"scripts/**" = ["T201"]
"tests/**" = ["T201"]
"benchmarks/**" = ["T201"]
