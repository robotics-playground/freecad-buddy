; The addon's MCP proxy binds 127.0.0.1:8765 inside the container, which a published port cannot
; reach. This relay forwards the container's 18765 to it; compose publishes 18765 on the host
; loopback only, so the proxy stays unreachable from the network.
[program:fcb-mcp-relay]
command=/usr/bin/socat TCP-LISTEN:18765,fork,reuseaddr TCP:127.0.0.1:8765
user=cua
autostart=true
autorestart=true
stdout_logfile=/var/log/fcb-mcp-relay.log
redirect_stderr=true
