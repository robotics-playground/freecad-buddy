id: g3-dev-020-twin-boss-block
gate: g3
criterion: G3.1
# Assertions hand-derived from the spec text below, never captured from a verify
# tool (AD-13/AD-19). Derivations:
# base = 80*30*10 = 24000; bosses add 2*pi*7^2*12 = 3694.513
# each 6 mm hole runs 10 (block) + 12 (boss) = 22 mm; two remove 2*pi*3^2*22 = 1244.071
# volume = 26450.442 mm^3
# boss axis spacing 50 mm, symmetric about the 80 mm centre -> each 15 mm from its end
# ((80-50)/2 = 15)
# total height = 10 + 12 = 22 mm; bbox = 80 x 30 x 22
# the bosses are NOT holes (material lies inside their cylinders, rule 1), so the hole count is
# the two 6 mm bores only
spec: >-
  A spacer block 80 mm by 30 mm and 10 mm thick carrying two cylindrical bosses on its top face.
  Each boss is 14 mm in diameter and 12 mm tall, and their axes are 50 mm apart, symmetric about
  the block centre. A 6 mm hole runs through each boss and the block beneath it.
# The designer BUILDS this part from the spec text; there is no input document to
# ship, so the case declares no fixture and check_provenance exempts it by kind.
fixture: none-spec-to-part
provenance: ../../../_registry/provenance/g3-dev-020-twin-boss-block.yaml
assertions:
  anchor_frame: {kind: base_sketch_plane, ref: 'XY_Plane'}
  checks:
    - {fn: is_valid_solid, expect: true}
    - {fn: expect_volume, expect: 26450.442, tol: {rel: 0.001}}
    - {fn: expect_bbox, expect: [80.0, 30.0, 22.0], tol: {abs: 0.05}}
    - {fn: count_cylindrical_holes, expect: 2}
    - {fn: hole_spacing, expect: 50.0, tol: {abs: 0.05}}
    - {fn: hole_diameter, expect: 6.0, tol: {abs: 0.05}}
    - {fn: hole_through, expect: true}
    - {fn: distance_between, expect: 50.0, tol: {abs: 0.05}}
