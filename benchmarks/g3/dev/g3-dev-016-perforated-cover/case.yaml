id: g3-dev-016-perforated-cover
gate: g3
criterion: G3.1
# Assertions hand-derived from the spec text below, never captured from a verify
# tool (AD-13/AD-19). Derivations:
# volume = 100*100*4 - 9*pi*3^2*4 = 40000 - 1017.876 = 38982.124 mm^3
# a 3x3 grid at 30 mm pitch spans 60 mm, centred on a 100 mm plate -> 20 mm margin
# every hole's nearest neighbour is 30 mm away in X or Y, so one declared pitch covers both
# directions
# bbox = 100 x 100 x 4
spec: >-
  A ventilation cover plate 100 mm square and 4 mm thick, perforated by a three-by-three grid of
  6 mm through holes. The grid is centred on the plate and the holes are 30 mm apart in both
  directions.
# The designer BUILDS this part from the spec text; there is no input document to
# ship, so the case declares no fixture and check_provenance exempts it by kind.
fixture: none-spec-to-part
provenance: ../../../_registry/provenance/g3-dev-016-perforated-cover.yaml
assertions:
  anchor_frame: {kind: base_sketch_plane, ref: 'XY_Plane'}
  checks:
    - {fn: is_valid_solid, expect: true}
    - {fn: expect_volume, expect: 38982.124, tol: {rel: 0.001}}
    - {fn: expect_bbox, expect: [100.0, 100.0, 4.0], tol: {abs: 0.05}}
    - {fn: count_cylindrical_holes, expect: 9}
    - {fn: hole_spacing, expect: 30.0, tol: {abs: 0.05}}
    - {fn: hole_diameter, expect: 6.0, tol: {abs: 0.05}}
    - {fn: hole_through, expect: true}
