id: g3-dev-004-round-standoff
gate: g3
criterion: G3.1
# Assertions hand-derived from the spec text below, never captured from a verify
# tool (AD-13/AD-19). Derivations:
# volume = pi*(5^2 - 1.6^2)*20 = pi*22.44*20 = 1409.947 mm^3
# bbox = 10 x 10 x 20
# the bore is coaxial, so its axis crosses the full 20 mm of material -> through
# wall: the coaxial bore leaves (10 - 3.2)/2 = 3.4 mm to the outside face
#
# Audit amendment, made after the reverted designer code existed (like DW-122 on 007/011):
# the wall check. Without it a bore off the axis passed, although the spec states
# the bore is coaxial.
# It adds a requirement the spec text states and relaxes none.
spec: >-
  A round standoff 20 mm long with a 10 mm outside diameter and a 3.2 mm through bore for an M3
  screw. The bore is coaxial with the outside diameter.
# The designer BUILDS this part from the spec text; there is no input document to
# ship, so the case declares `fixture: none-spec-to-part`, which check_provenance exempts.
fixture: none-spec-to-part
provenance: ../../../_registry/provenance/g3-dev-004-round-standoff.yaml
assertions:
  anchor_frame: {kind: base_sketch_plane, ref: 'XY_Plane'}
  checks:
    - {fn: is_valid_solid, expect: true}
    - {fn: expect_volume, expect: 1409.947, tol: {rel: 0.001}}
    - {fn: expect_bbox, expect: [10.0, 10.0, 20.0], tol: {abs: 0.05}}
    - {fn: count_cylindrical_holes, expect: 1}
    - {fn: hole_diameter, expect: 3.2, tol: {abs: 0.05}}
    - {fn: hole_through, expect: true}
    - {fn: distance_between, select_a: {hole: {diameter: 3.2}}, select_b: {face: {diameter: 10.0}}, expect: 3.4, tol: {abs: 0.05}}
