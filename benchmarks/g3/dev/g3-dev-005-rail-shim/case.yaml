id: g3-dev-005-rail-shim
gate: g3
criterion: G3.1
# Assertions hand-derived from the spec text below, never captured from a verify
# tool (AD-13/AD-19). Derivations:
# volume = 100*20*3 - 2*pi*3^2*3 = 6000 - 169.646 = 5830.354 mm^3
# hole spacing = 100 - 2*10 = 80 mm
# bbox = 100 x 20 x 3
# edge distances: each hole is 10 mm from its end and on the centreline of the 20 mm
# width, so the nearest hole wall is 10 - 3 = 7 mm from each end face and each side face
#
# Audit amendment, made after the reverted designer code existed (like DW-122 on 007/011):
# the four distance_between checks. Without them a hole pair off the centreline, or
# 80 mm apart but nearer one end, passed.
# It adds a requirement the spec text states and relaxes none.
spec: >-
  A shim strip 100 mm long, 20 mm wide and 3 mm thick. Drill two 6 mm through holes on the long
  centreline, each 10 mm from one end, so the holes are 80 mm apart.
# The designer BUILDS this part from the spec text; there is no input document to
# ship, so the case declares `fixture: none-spec-to-part`, which check_provenance exempts.
fixture: none-spec-to-part
provenance: ../../../_registry/provenance/g3-dev-005-rail-shim.yaml
assertions:
  anchor_frame: {kind: base_sketch_plane, ref: 'XY_Plane'}
  checks:
    - {fn: is_valid_solid, expect: true}
    - {fn: expect_volume, expect: 5830.354, tol: {rel: 0.001}}
    - {fn: expect_bbox, expect: [100.0, 20.0, 3.0], tol: {abs: 0.05}}
    - {fn: count_cylindrical_holes, expect: 2}
    - {fn: hole_spacing, expect: 80.0, tol: {abs: 0.05}}
    - {fn: hole_diameter, expect: 6.0, tol: {abs: 0.05}}
    - {fn: hole_through, expect: true}
    - {fn: distance_between, select_a: {hole: {diameter: 6.0}}, select_b: {face: {normal: [-1, 0, 0]}}, expect: 7.0, tol: {abs: 0.05}}
    - {fn: distance_between, select_a: {hole: {diameter: 6.0}}, select_b: {face: {normal: [1, 0, 0]}}, expect: 7.0, tol: {abs: 0.05}}
    - {fn: distance_between, select_a: {hole: {diameter: 6.0}}, select_b: {face: {normal: [0, -1, 0]}}, expect: 7.0, tol: {abs: 0.05}}
    - {fn: distance_between, select_a: {hole: {diameter: 6.0}}, select_b: {face: {normal: [0, 1, 0]}}, expect: 7.0, tol: {abs: 0.05}}
