id: g3-dev-001-mounting-plate
gate: g3
criterion: G3.1
# Assertions hand-derived from the spec text below, never captured from a verify
# tool (AD-13/AD-19). Derivations:
# volume = 80*60*6 - 4*pi*2.75^2*6 = 28800 - 570.199 = 28229.801 mm^3
# hole pitch: 10 mm inset from each edge leaves 80-2*10 = 60 mm along X and 60-2*10 = 40 mm
# along Y; nearest neighbour of every corner hole is the 40 mm Y gap
# bbox in the base sketch plane frame = the plate's own 80 x 60 x 6 extents
# edge distances: every hole centre is 10 mm from both adjacent edges, so the hole wall
# nearest each of the four edge faces is 10 - 5.5/2 = 7.25 mm from it
#
# Audit amendment, made after the reverted designer code existed (like DW-122 on 007/011):
# the four distance_between checks. Without them a correctly sized 60 x 40 hole
# rectangle shifted towards one edge passed: count, diameter and nearest-neighbour
# spacing do not see where the rectangle sits on the plate.
# It adds a requirement the spec text states and relaxes none.
spec: >-
  A rectangular mounting plate 80 mm long, 60 mm wide and 6 mm thick. Drill four 5.5 mm
  clearance holes for M5 screws, one at each corner, each centred 10 mm from both adjacent
  edges. All four holes go through the plate.
# The designer BUILDS this part from the spec text; there is no input document to
# ship, so the case declares `fixture: none-spec-to-part`, which check_provenance exempts.
fixture: none-spec-to-part
provenance: ../../../_registry/provenance/g3-dev-001-mounting-plate.yaml
assertions:
  anchor_frame: {kind: base_sketch_plane, ref: 'XY_Plane'}
  checks:
    - {fn: is_valid_solid, expect: true}
    - {fn: expect_volume, expect: 28229.801, tol: {rel: 0.001}}
    - {fn: expect_bbox, expect: [80.0, 60.0, 6.0], tol: {abs: 0.05}}
    - {fn: count_cylindrical_holes, expect: 4}
    - {fn: hole_diameter, expect: 5.5, tol: {abs: 0.05}}
    - {fn: hole_spacing, expect: 40.0, tol: {abs: 0.05}}
    - {fn: hole_through, expect: true}
    - {fn: distance_between, select_a: {hole: {diameter: 5.5}}, select_b: {face: {normal: [-1, 0, 0]}}, expect: 7.25, tol: {abs: 0.05}}
    - {fn: distance_between, select_a: {hole: {diameter: 5.5}}, select_b: {face: {normal: [1, 0, 0]}}, expect: 7.25, tol: {abs: 0.05}}
    - {fn: distance_between, select_a: {hole: {diameter: 5.5}}, select_b: {face: {normal: [0, -1, 0]}}, expect: 7.25, tol: {abs: 0.05}}
    - {fn: distance_between, select_a: {hole: {diameter: 5.5}}, select_b: {face: {normal: [0, 1, 0]}}, expect: 7.25, tol: {abs: 0.05}}
