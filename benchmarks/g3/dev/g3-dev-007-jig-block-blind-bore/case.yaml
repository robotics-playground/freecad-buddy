id: g3-dev-007-jig-block-blind-bore
gate: g3
criterion: G3.1
# Assertions hand-derived from the spec text below, never captured from a verify
# tool (AD-13/AD-19). Derivations:
# volume = 50*50*25 - pi*6^2*15 = 62500 - 1696.460 = 60803.540 mm^3
# the hole is 15 mm deep in 25 mm of material, so it is NOT through
# bbox = 50 x 50 x 25
# anchor face: bottom 50*50 = 2500 mm^2 beats the top 2500 - pi*6^2 = 2386.903 mm^2 (the bore
# opening) and each side 50*25 = 1250 mm^2, so the bottom face is the frame and its centroid the
# origin. The bore enters the centre of the top face square to it, so its axis is the frame
# normal [0, 0, 1] (a line: sign ignored) and meets the anchor plane at (0, 0).
#
# The hole_position check was ADDED after the reverted designer code existed (DW-122). Without
# it a bore of the same diameter and depth sketched on a side face passes every other check:
# volume, bbox, count, diameter and blind depth are all unchanged by the move. The axis in the
# selector is what a side-face bore violates. Like g3-dev-002 (DW-129), this amends an entry-gate
# assertion set after implementation existed; it adds a requirement the spec text already states
# ("into the centre of the top face") and relaxes nothing.
spec: >-
  A 50 mm cube-section jig block 25 mm tall. Bore a single 12 mm hole 15 mm deep into the centre
  of the top face. The hole does not break through the bottom.
# The designer BUILDS this part from the spec text; there is no input document to
# ship, so the case declares `fixture: none-spec-to-part`, which check_provenance exempts.
fixture: none-spec-to-part
provenance: ../../../_registry/provenance/g3-dev-007-jig-block-blind-bore.yaml
assertions:
  anchor_frame: {kind: largest_planar_face, ref: null}
  checks:
    - {fn: is_valid_solid, expect: true}
    - {fn: expect_volume, expect: 60803.54, tol: {rel: 0.001}}
    - {fn: expect_bbox, expect: [50.0, 50.0, 25.0], tol: {abs: 0.05}}
    - {fn: count_cylindrical_holes, expect: 1}
    - {fn: hole_diameter, expect: 12.0, tol: {abs: 0.05}}
    - {fn: hole_through, expect: false}
    - {fn: hole_position, select: {diameter: 12.0, axis: [0, 0, 1]}, expect: [0.0, 0.0], tol: {abs: 0.05}}
