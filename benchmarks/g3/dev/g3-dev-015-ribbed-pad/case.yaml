id: g3-dev-015-ribbed-pad
gate: g3
criterion: G3.1
# Assertions hand-derived from the spec text below, never captured from a verify
# tool (AD-13/AD-19). Derivations:
# volume = 60*40*5 + 60*6*20 = 12000 + 7200 = 19200 mm^3
# total height = 5 (base) + 20 (rib) = 25 mm
# bbox = 60 x 40 x 25
# the rib's side face is perpendicular to the base's top face -> 90 deg
# rib on the centreline: the rib's +Y side face sits at 6/2 = 3 mm and the base's +Y side
# face at 40/2 = 20 mm from the centreline, so the two +Y faces are 17 mm apart
#
# Audit amendment, made after the reverted designer code existed (like DW-122 on 007/011):
# the rib-position check. Without it a rib of the right size standing off the
# centreline passed: volume, bbox and the 90 degree angle are unchanged.
# It adds a requirement the spec text states and relaxes none.
# angle_between selectors: a vertical rib's +Y side face (outward normal +Y) stands on the
# base top (outward normal +Z) at 90 deg
#
# Selector amendment, made after the reverted designer code existed: the angle_between check
# gained `select_a` and `select_b`. verification-design 7.2 signs it with two selectors, so
# without them it could not be evaluated and failed a faithful part. It relaxes nothing.
spec: >-
  A stiffened pad: a 60 mm by 40 mm base plate 5 mm thick with a single vertical rib standing on
  the base's long centreline. The rib is 60 mm long, 6 mm thick and rises 20 mm above the base.
# The designer BUILDS this part from the spec text; there is no input document to
# ship, so the case declares `fixture: none-spec-to-part`, which check_provenance exempts.
fixture: none-spec-to-part
provenance: ../../../_registry/provenance/g3-dev-015-ribbed-pad.yaml
assertions:
  anchor_frame: {kind: base_sketch_plane, ref: 'XY_Plane'}
  checks:
    - {fn: is_valid_solid, expect: true}
    - {fn: expect_volume, expect: 19200.0, tol: {rel: 0.001}}
    - {fn: expect_bbox, expect: [60.0, 40.0, 25.0], tol: {abs: 0.05}}
    - {fn: angle_between, select_a: {face: {normal: [0, 0, 1]}}, select_b: {face: {normal: [0, 1, 0]}}, expect: 90.0, tol: {abs: 0.1}}
    - {fn: distance_between, select_a: {face: {normal: [0, 1, 0]}}, select_b: {face: {normal: [0, 1, 0]}}, expect: 17.0, tol: {abs: 0.05}}
