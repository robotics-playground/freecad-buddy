id: g3-fault-recompute-parameter-removed-under-binding
gate: g3
criterion: G3.3
targets_validator: verify_recompute@usecases.verify.verify_recompute
fault:
  kind: planted_defect
  description: >-
    A driving parameter is removed from its holder while a feature property is still bound to it
    by expression.
  expectation: DETECT
fault_class: broken_expression
detected_by: recompute.object
# Detection must come from reading the DOCUMENT the production path left behind. A validator that
# reported this case by inspecting the mutation status, or by the case's own declaration, would
# pass the suite while catching no real broken document (AD-13: measure the artifact).
# The fault is planted by running `planted_op` through `usecases.transaction.run_mutation` - the
# production bracket every shipped mutation tool writes through - after its fixture builds the same
# way. No .FCStd ships: the document IS the fixture, which is why `fixture` declares the driver
# rather than a file.
planted_op: parameter_removed_under_binding
fixture: driven-by-mutation-bracket
