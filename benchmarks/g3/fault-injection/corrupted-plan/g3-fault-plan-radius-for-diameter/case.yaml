id: g3-fault-plan-radius-for-diameter
gate: g3
criterion: G3.4
targets_validator: assertions@harness.assertions.evaluate
fault:
  kind: planted_defect
  description: >-
    The plan reads the spec's 16 mm collar bore as a radius and sketches a 32 mm circle. The
    single substituted number cuts the collar's 40 mm outside diameter down to a 4 mm wall.
  expectation: DETECT
corruption_class: value
spec_ref: g3-dev-003-shaft-collar
detected_by: hole_diameter
# A corrupted plan is a recorded plan: `plan` lists, in order, the {tool, args} calls an actor
# issues through the MCP mutation tools to build `spec_ref`. `$doc` stands for the handle the
# `document_create` step returns. `planted_step` is the 0-based index of the one defect step.
# The repository never generates or repairs a plan. Story 4.2 replays this one, and the spec's
# own assertions grade the part it produces (AD-35). Detection must come from measuring that
# part, never from reading the plan (AD-13).
planted_step: 3
plan:
  # [0]
  - {tool: document_create, args: {label: g3-fault-plan-radius-for-diameter}}
  # [1]
  - {tool: feature_body_create, args: {doc: '$doc', name: Body}}
  # [2]
  - {tool: sketch_create, args: {doc: '$doc', name: CollarSketch, plane: XY, body: Body}}
  # [3] planted defect: the bore circle has radius 16, so a 32 mm bore
  - tool: sketch_add_geometry
    args:
      doc: '$doc'
      sketch: CollarSketch
      geometry:
        - {kind: circle, center: [0.0, 0.0], radius: {value: 20.0, unit: mm}}
        - {kind: circle, center: [0.0, 0.0], radius: {value: 16.0, unit: mm}}
      constraints:
        - {type: Radius, first: 0, value: {value: 20.0, unit: mm}}
        - {type: Coincident, first: 0, first_pos: 3, second: -1, second_pos: 1}
        - {type: Radius, first: 1, value: {value: 16.0, unit: mm}}
        - {type: Coincident, first: 1, first_pos: 3, second: -1, second_pos: 1}
  # [4]
  - tool: feature_pad
    args:
      doc: '$doc'
      body: Body
      profile: CollarSketch
      name: Collar
      length: {value: 15.0, unit: mm}
      reversed: true
# The replay that plants this fault lands in Story 4.2, so the fixture is declared pending.
fixture: pending
provenance: ../../../../_registry/provenance/g3-fault-plan-radius-for-diameter.yaml
