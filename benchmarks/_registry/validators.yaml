verify_recompute:
  suite: g3/fault-injection/recompute/
  validator_sha: "5c35c164ba4792139320c4fd45cd7a76a10d4165590f41642196a83fba6f917a"
  last_run:
    run_id: g3-2026-09-14-1
    sensitivity: 1.0
    false_alarm: 0.0
    date: 2026-09-14
    skipped_cases: 2
    excluded_unscorable:
      g3-fault-recompute-circular-dependency: "a circular dependency cannot be planted through the production path. Measured on FreeCAD 1.1.0 by running the op through score_recompute_infc.run_case: Cut already consumes Base, so `Base.setExpression('Height', 'Cut.Shape.BoundBox.ZLength')` closes the loop, and FreeCAD raises RuntimeError: cyclic reference to <doc>#Cut at setExpression time, inside the op. The bracket maps that to SPEC_FAILED and rolls back, leaving Base, Tool and Cut all ['Up-to-date'] 'Valid' and verify_recompute reporting verdict=OK with failing_objects=[]. The cycle is refused before it exists, so there is no document state for the validator to read. This is FreeCAD's own guard working, not a validator miss"
      g3-fault-recompute-parameter-removed-under-binding: "removing a driving parameter from its holder plants no fault. Measured on FreeCAD 1.1.0 by running the op through score_recompute_infc.run_case: `parameters.declare` binds Box.Height by expression to Parameters.plate_thickness, then `holder.removeProperty('plate_thickness')` inside the production bracket commits OK and leaves the document at Box=['Up-to-date'] 'Valid', Parameters=['Up-to-date'] 'Valid' with verify_recompute reporting verdict=OK and failing_objects=[]. FreeCAD does not re-evaluate a bound expression when the property it names is dropped, so no object enters error state. Scoring this as a miss would blame verify_recompute for a defect that was never created; the real gap is that removeProperty leaves a stale binding silently, which is a finding about parameters.py and not about this validator"
    wilson_ci:
      rate: 1.0
      low: 0.7225
      high: 1.0
      n: 10
      r: 10
