corrupted_plan:
  suite: g3/fault-injection/corrupted-plan/
  validator_sha: "c1c9f854d7ae37858f9193aed269c84d54aa5c1e009e08307a4985fc817c882b"
  last_run:
    run_id: g3-2026-09-14-1
    sensitivity: 1.0
    false_alarm: 0.0
    date: 2026-09-14
    skipped_cases: 2
    excluded_unscorable:
      g3-fault-plan-hole-on-wrong-face: "g3-fault-plan-hole-on-wrong-face declares detected_by: hole_position, but its spec g3-dev-007-jig-block-blind-bore declares no hole_position check. Measured: moving the 12 mm x 15 mm bore from the top face to a side face leaves every declared assertion passing — volume 60803.540 (expect 60803.54), bbox [50, 50, 25], one logical hole, diameter 12.0, hole_through False. The axis direction is what changed and no declared assertion reads it. Scoring this as a miss would blame the loop for a spec that cannot decide the case; the fix is a hole_position or expect_extent check on the dev spec, which is an assertion-set change and not this story's to make (AD-19)"
      g3-fault-plan-mirrored-hole-pattern: 'g3-fault-plan-mirrored-hole-pattern declares detected_by: hole_position, but its spec g3-dev-011-lever-arm declares no hole_position check. Measured: swapping the 12 mm pivot and the 8 mm linkage bore between the two ends leaves volume 13093.097, bbox [90, 20, 8], two logical holes, spacing 60.0 and hole_through True — every declared assertion passes, because the pattern is symmetric under the mirror in all of them. Only WHICH end carries WHICH diameter changed, and that needs a per-hole position or a diameter-banded position check the spec does not declare'
    wilson_ci:
      rate: 1.0
      low: 0.6756
      high: 1.0
      n: 8
      r: 8

