id: g2-fault-sketch-over-contradicting-width
gate: g2
criterion: G2.5
targets_validator: verify_sketch@usecases.verify.read_sketch
fault:
  kind: planted_defect
  description: >-
    The 20 mm side is dimensioned a second time as 25 mm; the two dimensions cannot both hold.
  expectation: DETECT
expected:
  dof: -1
  fully_constrained: true
  conflicting_count: 2
  trigger: "dof < 0 and non-empty conflicting"
# The fault is a runtime path, not a defective saved sketch: the fixture is the clean
# pre-mutation input and the op named here plants the defect through the production
# mutation path, where verify_sketch grades the document that path produced.
planted_op: add_contradicting_width
fixture: fixture.FCStd
provenance: ../../../../_registry/provenance/g2-fault-sketch-over-contradicting-width.yaml
