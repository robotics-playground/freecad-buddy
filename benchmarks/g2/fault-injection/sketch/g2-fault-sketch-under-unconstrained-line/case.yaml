id: g2-fault-sketch-under-unconstrained-line
gate: g2
criterion: G2.5
targets_validator: verify_sketch@usecases.verify.read_sketch
fault:
  kind: planted_defect
  description: >-
    A line is added carrying no constraint, so the sketch keeps four degrees of freedom the
    solver cannot remove.
  expectation: DETECT
expected:
  dof: 4
  fully_constrained: false
  trigger: "dof > 0"
# The fault is a runtime path, not a defective saved sketch: the fixture is the clean
# pre-mutation input and the op named here plants the defect through the production
# mutation path, where verify_sketch grades the document that path produced.
planted_op: add_unconstrained_line
fixture: fixture.FCStd
provenance: ../../../../_registry/provenance/g2-fault-sketch-under-unconstrained-line.yaml
