id: g2-fault-sketch-degenerate-collapsed-by-datum
gate: g2
criterion: G2.5
targets_validator: verify_sketch@usecases.verify.read_sketch
fault:
  kind: planted_defect
  description: >-
    A well-formed dimensioned segment is collapsed to zero length by driving its own length
    datum to 0 mm, so the solver produces the degeneracy rather than the written coordinates.
  expectation: DETECT
expected:
  dof: 0
  fully_constrained: true
  degenerate_geometry_count: 1
  trigger: "degenerate_geometry_count > 0"
# The fault is a runtime path, not a defective saved sketch: the fixture is the clean
# pre-mutation input and the op named here plants the defect through the production
# mutation path, where verify_sketch grades the document that path produced.
planted_op: collapse_segment_by_datum
fixture: fixture.FCStd
provenance: ../../../../_registry/provenance/g2-fault-sketch-degenerate-collapsed-by-datum.yaml
