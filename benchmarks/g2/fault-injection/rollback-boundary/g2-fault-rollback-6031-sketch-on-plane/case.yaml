id: g2-fault-rollback-6031-sketch-on-plane
gate: g2
criterion: G2.2
targets_validator: run_mutation@usecases.transaction.run_mutation
fault:
  kind: planted_defect
  description: >-
    The #6031 pattern: a sketch created on a plane in PartDesign inside a transaction persists after abort, so the post-abort fingerprint does not match.
  expectation: DETECT
# The fault is a runtime path, not defective geometry: the fixture is the pre-mutation input (an
# empty PartDesign Body with its Origin datum planes) and the op named here plants the sketch.
planted_op: sketch_on_datum_plane_then_raise
expected:
  issue: "FreeCAD#6031"
  # Measured on FreeCAD 1.1.1 (Libs 1.1.1R20260414): abort DOES restore this variant, so the
  # re-hash fast path proves the rollback and the snapshot escalation is not reached. The case
  # stays a sensitivity case for G2.2 — the mutation must still roll back and PROVE it — but the
  # snapshot path it was authored against is only reachable on a build where abort leaves the
  # sketch behind. `expected_path_by_build` records both so a regression on either is visible.
  expected_path: "abort"
  expected_rollback: "rolled_back_verified"
  expected_path_by_build:
    abort_restores_sketch: {path: "abort", rollback: "rolled_back_verified"}
    abort_leaves_sketch: {path: "snapshot_restore", rollback: "rolled_back_via_snapshot"}
fixture: fixture.FCStd
provenance: ../../../../_registry/provenance/g2-fault-rollback-6031-sketch-on-plane.yaml
