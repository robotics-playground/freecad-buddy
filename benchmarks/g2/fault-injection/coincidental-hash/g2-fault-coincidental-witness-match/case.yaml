id: g2-fault-coincidental-witness-match
gate: g2
criterion: G2.4
targets_validator: audit_references@usecases.tnp_guard.audit_references
fault:
  kind: planted_defect
  description: >-
    A reference is re-pointed to a different element whose witness hash coincides with the original; Layer 1 sees no change.
  expectation: DETECT
expected:
