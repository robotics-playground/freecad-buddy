id: g2-dev-031-pattern
gate: g2
criterion: G2.1
op_type: pattern
# a 3-occurrence linear pattern includes the original, so 3 holes at 10 mm pitch
spec: "Make a linear pattern of the hole, 3 copies spaced 10 mm along X."
inputs:
  document: ../../../g0/golden-models/box40-hole-r5.FCStd
assertions:
  anchor_frame: {kind: largest_planar_face, ref: null}
  checks:
    - {fn: count_cylindrical_holes, expect: 3}
    - {fn: hole_spacing, pattern: linear, expect: 10.0, tol: {abs: 0.05}}
