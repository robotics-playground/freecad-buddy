  - id: g1-eval-21
    category: tree-explanation
    criterion: G1.1
    question: "Summarize the top-level document tree structure."
    expected_findings:
      - "lists each top-level object by Label"
      - "groups features under their parent Body"
      - "notes object count"
  - id: g1-eval-22
    category: tree-explanation
    criterion: G1.1
    question: "Which object is the tip feature of the active PartDesign Body?"
    expected_findings:
      - "identifies the last solid feature in the Body"
      - "reports the tip by Name"
      - "distinguishes tip from base"
  - id: g1-eval-23
    category: tree-explanation
    criterion: G1.1
    question: "Explain the parent-child relationships between the sketch and the pad."
    expected_findings:
      - "sketch is the pad profile"
      - "pad depends on the sketch"
      - "sketch is a child in the pad dependency graph"
  - id: g1-eval-24
    category: tree-explanation
    criterion: G1.1
    question: "How many solids does the current document contain?"
    expected_findings:
      - "counts Part Feature solids"
      - "excludes datum and sketch objects from the solid count"
  - id: g1-eval-25
    category: tree-explanation
    criterion: G1.1
    question: "Describe what the fillet feature is applied to."
    expected_findings:
      - "fillet references edges of its base feature"
      - "names the base feature"
      - "reports the fillet radius"
  - id: g1-eval-26
    category: tree-explanation
    criterion: G1.1
    question: "Summarize the feature history of the main body in build order."
    expected_findings:
      - "lists features in creation order"
      - "each feature names its immediate predecessor"
  - id: g1-eval-27
    category: tree-explanation
    criterion: G1.1
    question: "Which sketches are consumed by downstream features vs standalone?"
    expected_findings:
      - "separates consumed sketches from standalone"
      - "names the consuming feature for each"
  - id: g1-eval-28
    category: tree-explanation
    criterion: G1.1
    question: "What datum planes exist and what references them?"
    expected_findings:
      - "lists datum planes by Name"
      - "reports which features attach to each datum"
  - id: g1-eval-29
