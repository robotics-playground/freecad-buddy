# G1 eval set: 50 hand-authored questions with independent expected findings (FR7).
# Categories: tree-explanation, error-diagnosis, next-tool-guidance. expected_findings
# are independently hand-authored references, NEVER captured from a running assistant.
# error-diagnosis questions reference the broken-doc fixtures under dev/broken-docs/.

questions:
  - id: g1-eval-01
    category: error-diagnosis
    criterion: G1.2
    question: "The document fails to recompute. Which object is in error and why?"
    doc_fixture: dev/broken-docs/oc-bracket-plate/fixture.FCStd
    expected_findings:
      object: BracketPlate
      cause: "conflicting over-constrained sketch constraints"
